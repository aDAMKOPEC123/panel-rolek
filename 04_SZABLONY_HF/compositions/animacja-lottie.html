<!doctype html>
<!--
  animacja-lottie: animacja Lottie (eksport z After Effects przez Bodymovin, LottieFiles, Prompt to Lottie) na nagraniu.
  Plik .json z 03_BIBLIOTEKA/lottie/ albo z folderu rolki; zloz wkleja go do kompozycji (bez pobierania w czasie renderu).
  HyperFrames przewija animację klatka po klatce (adapter window.__hfLottie), więc render jest dokładny.
  Zmienne: plik (ścieżka), x, y (środek w px kadru 1080x1920), szerokosc (px), petla (tak = powtarza, nie = raz i stoi),
  kolory (oryginalne | marka: jasne -> biel, ciemne -> granat, reszta -> odcienie złota marki), krycie.
-->
<html
  lang="pl"
  data-composition-id="animacja-lottie"
  data-composition-duration="3"
  data-composition-variables='[
    {"id":"plik","type":"string","label":"Plik Lottie (.json)","default":""},
    {"id":"x","type":"number","label":"Środek X (px, 0-1080)","default":540,"min":0,"max":1080,"step":5},
    {"id":"y","type":"number","label":"Środek Y (px, 0-1920)","default":860,"min":0,"max":1920,"step":5},
    {"id":"szerokosc","type":"number","label":"Szerokość (px)","default":620,"min":80,"max":1080,"step":10},
    {"id":"petla","type":"boolean","label":"Zapętlaj","default":false},
    {"id":"kolory","type":"enum","label":"Kolory","default":"marka","options":[{"value":"marka","label":"Kolory marki (złoto, biel, granat)"},{"value":"oryginalne","label":"Oryginalne"}]},
    {"id":"krycie","type":"number","label":"Krycie (0-1)","default":1,"min":0.1,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Animacja Lottie</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="animacja-lottie" data-duration="3" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
          .lt-clip { position: absolute; inset: 0; }
          .lt-box { position: absolute; width: 620px; height: 620px; }
          .lt-box svg { display: block; }
          .lt-brak { position: absolute; left: 140px; right: 140px; top: 860px; padding: 24px; border: 4px dashed rgba(255, 255, 255, 0.8); border-radius: 24px; color: #fff; font: 600 36px/1.3 var(--font-tekst, "Montserrat"), sans-serif; text-align: center; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); }
        </style>
        <div id="animacja-lottie-clip" class="clip lt-clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="animacja-lottie-box" class="lt-box"></div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var ID = "animacja-lottie";
            var $ = function (s) { return document.getElementById(ID + "-" + s); };
            var clip = $("clip"), box = $("box");
            var D = parseFloat(clip.getAttribute("data-duration")) || 3;
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var DANE = /*LOTTIE_START*/null/*LOTTIE_END*/;
            var RUCH = (function () { var cs = getComputedStyle(document.documentElement), g = function (n, d) { var v = (cs.getPropertyValue(n) || "").trim().replace(/^["']|["']$/g, ""); return v || d; }; return { we: g("--ruch-wejscie", "power2.out"), wy: g("--ruch-wyjscie", "power2.in"), ak: g("--ruch-akcent", "back.out(2)"), pl: g("--ruch-plynny", "power2.inOut") }; })(); // styl ruchu marki (zloz: --ruch-*)
            var tl = gsap.timeline({ paused: true });
            if (!DANE || !window.lottie) {
              var b = document.createElement("div"); b.className = "lt-brak";
              b.textContent = "Wybierz plik Lottie (.json) w scenie";
              clip.appendChild(b);
            } else {
              var dane = JSON.parse(JSON.stringify(DANE));
              var Wl = dane.w || 512, Hl = dane.h || 512;
              var sz = Number(v.szerokosc) || 620, wys = Math.round((sz * Hl) / Wl);
              var X = Number(v.x != null && v.x !== "" ? v.x : 540), Y = Number(v.y != null && v.y !== "" ? v.y : 860);
              box.style.width = sz + "px"; box.style.height = wys + "px";
              box.style.left = X - sz / 2 + "px"; box.style.top = Y - wys / 2 + "px";
              box.style.opacity = v.krycie != null && v.krycie !== "" ? v.krycie : 1;
              if ((v.kolory || "marka") === "marka") {
                // Przekolorowanie: każdy kolor (statyczny i w klatkach kluczowych) -> paleta marki wg jasności.
                var cs = getComputedStyle(clip);
                var hex = function (n, d) { var s = (cs.getPropertyValue(n) || "").trim() || d; var m = s.replace("#", ""); return [0, 2, 4].map(function (i) { return parseInt(m.substr(i, 2), 16) / 255; }); };
                var BIEL = [1, 1, 1], GRANAT = hex("--tekst", "#082032"), Z1 = hex("--zloto-jasne", "#D7BD89"), Z2 = hex("--akcent", "#C8A15F"), Z3 = hex("--akcent-2", "#B47946");
                var mapuj = function (c) {
                  if (!Array.isArray(c) || c.length < 3 || typeof c[0] !== "number") return c;
                  var L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
                  var nowy = L > 0.86 ? BIEL : L < 0.22 ? GRANAT : L > 0.62 ? Z1 : L > 0.42 ? Z2 : Z3;
                  return [nowy[0], nowy[1], nowy[2]].concat(c.length > 3 ? [c[3]] : []);
                };
                var chodz = function (o) {
                  if (!o || typeof o !== "object") return;
                  if (Array.isArray(o)) { o.forEach(chodz); return; }
                  // kolor wypełnienia/obrysu: {ty:"fl"|"st"|"gf"?, c:{a, k}}
                  if (o.c && typeof o.c === "object" && "k" in o.c && (o.ty === "fl" || o.ty === "st")) {
                    if (o.c.a) (o.c.k || []).forEach(function (kf) { if (kf.s) kf.s = mapuj(kf.s); if (kf.e) kf.e = mapuj(kf.e); });
                    else o.c.k = mapuj(o.c.k);
                  }
                  if (o.ty === 1 && typeof o.sc === "string") { var r = mapuj([parseInt(o.sc.substr(1, 2), 16) / 255, parseInt(o.sc.substr(3, 2), 16) / 255, parseInt(o.sc.substr(5, 2), 16) / 255]); o.sc = "#" + r.slice(0, 3).map(function (x) { return ("0" + Math.round(x * 255).toString(16)).slice(-2); }).join(""); }
                  for (var k in o) if (k !== "c") chodz(o[k]);
                };
                chodz(dane.layers); chodz(dane.assets);
              }
              var anim = window.lottie.loadAnimation({ container: box, renderer: "svg", loop: !!v.petla, autoplay: false, animationData: dane, rendererSettings: { preserveAspectRatio: "xMidYMid meet" } });
              window.__hfLottie = window.__hfLottie || [];
              window.__hfLottie.push(anim);
              tl.fromTo(box, { opacity: 0 }, { opacity: box.style.opacity, duration: 0.15 }, 0);
              tl.to(box, { opacity: 0, duration: 0.25, ease: RUCH.wy }, Math.max(0.2, D - 0.25));
            }
            tl.set({}, {}, D);
            window.__timelines = window.__timelines || {};
            window.__timelines[ID] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>

<!doctype html>
<!--
  vlog-godzina: godzina i miejsce/rozdział dnia w vlogu („08:12 · kawa przed otwarciem”).
  Lewy górny róg pod strefą UI Instagrama (safe top 220 px). Godzina wpada cyframi jak licznik, opis wjeżdża.
  Zmienne: godzina, opis
-->
<html
  lang="pl"
  data-composition-id="vlog-godzina"
  data-composition-duration="2"
  data-composition-variables='[
    {"id":"godzina","type":"string","label":"Godzina","default":"08:12"},
    {"id":"opis","type":"string","label":"Opis / miejsce","default":"otwieram gabinet"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Vlog: godzina</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="vlog-godzina" data-duration="2" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-tekst, "Montserrat"), sans-serif; }
          .vg-clip { position: absolute; inset: 0; }
          .vg { position: absolute; left: var(--safe-left, 60px); top: calc(var(--safe-top, 220px) + 130px); display: flex; flex-direction: column; gap: 10px; }
          .vg-godz { font-family: var(--font-naglowki, "Playfair Display"), serif; font-size: 96px; font-weight: 700; line-height: 1; color: var(--bialy, #fff); text-shadow: 0 6px 26px rgba(0, 0, 0, 0.35); letter-spacing: 0.02em; }
          .vg-opis { align-self: flex-start; background: var(--akcent, #b07a6e); color: #fff; font-size: 32px; font-weight: 600; padding: 10px 22px; border-radius: 999px; box-shadow: 0 10px 30px rgba(43, 35, 33, 0.25); white-space: nowrap; }
        </style>
        <div id="vlog-godzina-clip" class="clip vg-clip" data-start="0" data-duration="2" data-track-index="0">
          <div id="vlog-godzina-wrap" class="vg">
            <div id="vlog-godzina-godz" class="vg-godz"></div>
            <div id="vlog-godzina-opis" class="vg-opis"></div>
          </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var ID = "vlog-godzina";
            var $ = function (s) { return document.getElementById(ID + "-" + s); };
            var D = parseFloat($("clip").getAttribute("data-duration")) || 2;
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var godz = v.godzina == null ? "08:12" : String(v.godzina);
            var opis = v.opis == null ? "otwieram gabinet" : String(v.opis);
            $("opis").textContent = opis;
            if (!opis) $("opis").style.display = "none";
            // Licznik: minuty „dobiegają” do właściwej godziny (deterministycznie, z osi czasu).
            var m = godz.match(/^(\d{1,2}):(\d{2})$/);
            var cel = m ? Number(m[1]) * 60 + Number(m[2]) : null;
            var stan = { t: 0 };
            var pokaz = function () {
              if (cel == null) { $("godz").textContent = godz; return; }
              var x = Math.round(cel - (1 - stan.t) * 23);
              x = ((x % 1440) + 1440) % 1440;
              $("godz").textContent = String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0");
            };
            pokaz();
            var RUCH = (function () { var cs = getComputedStyle(document.documentElement), g = function (n, d) { var v = (cs.getPropertyValue(n) || "").trim().replace(/^["']|["']$/g, ""); return v || d; }; return { we: g("--ruch-wejscie", "power2.out"), wy: g("--ruch-wyjscie", "power2.in"), ak: g("--ruch-akcent", "back.out(2)"), pl: g("--ruch-plynny", "power2.inOut") }; })(); // styl ruchu marki (zloz: --ruch-*)
            var tl = gsap.timeline({ paused: true });
            tl.fromTo($("godz"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.35, ease: RUCH.we }, 0.05);
            tl.fromTo(stan, { t: 0 }, { t: 1, duration: 0.45, ease: RUCH.we, onUpdate: pokaz }, 0.05);
            tl.fromTo($("opis"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: RUCH.ak }, 0.25);
            var out = Math.max(0.9, D - 0.3);
            tl.to($("wrap"), { opacity: 0, y: -10, duration: 0.25, ease: RUCH.wy }, out);
            tl.set($("wrap"), { visibility: "hidden" }, Math.min(D - 0.01, out + 0.26));
            window.__timelines = window.__timelines || {};
            window.__timelines[ID] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>

<!doctype html>
<!--
  glebia-tla: płytka głębia ostrości jak z dużego aparatu. Tło z nagrania jest rozmyte, postać (dłoń, twarz)
  z wycięcia zostaje ostra. Opcjonalny przesuw ostrości (rack focus): ostrość przechodzi z tła na postać albo odwrotnie.
  Warstwy: nagranie rozmyte (1) -> lekka winieta (2) -> wycięta postać ostra (3).
  Media (jak tekst-za-postacia, ten sam klip i ten sam początek):
    tlo      klip z proxy/
    wyciete  przezroczysty .webm z: npm run wytnij-tlo -- <projekt> proxy/X.mp4
  Zmienne: rozmycie (px), przesuw (brak | na-postac | na-tlo), czas_przesuwu (s), przyciemnienie (0-0.4), winieta.
  Bez wygładzania skóry: rozmywane jest tylko tło, postać zostaje nietknięta.
-->
<html
  lang="pl"
  data-composition-id="glebia-tla"
  data-composition-duration="3"
  data-composition-variables='[
    {"id":"rozmycie","type":"number","label":"Rozmycie tła (px)","default":14,"min":2,"max":40,"step":1},
    {"id":"przesuw","type":"enum","label":"Przesuw ostrości","default":"na-postac","options":[{"value":"brak","label":"Brak (tło od razu rozmyte)"},{"value":"na-postac","label":"Z tła na postać (tło się rozmywa)"},{"value":"na-tlo","label":"Z postaci na tło (tło się wyostrza)"}]},
    {"id":"czas_przesuwu","type":"number","label":"Czas przesuwu (s)","default":0.8,"min":0.2,"max":3,"step":0.1},
    {"id":"przyciemnienie","type":"number","label":"Przyciemnienie tła (0-0.4)","default":0.12,"min":0,"max":0.4,"step":0.02},
    {"id":"winieta","type":"boolean","label":"Winieta (ciemniejsze rogi)","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Rozmyte tło</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="glebia-tla" data-duration="3" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; background: var(--tekst, #082032); }
          .gt-media { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
          .gt-tlo { transform: scale(1.06); transform-origin: 50% 50%; }
          .gt-nakladka { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
        </style>
        <video id="glebia-tla-tlo" class="clip gt-media gt-tlo" data-slot-media="tlo" src="assets/demo/tlo.mp4" data-start="0" data-duration="3" data-track-index="0" muted playsinline style="z-index:1"></video>
        <div id="glebia-tla-nakladka" class="clip gt-nakladka" data-start="0" data-duration="3" data-track-index="1"></div>
        <video id="glebia-tla-wyciete" class="clip gt-media" data-slot-media="wyciete" src="assets/demo/wyciete.webm" data-start="0" data-duration="3" data-track-index="2" muted playsinline data-layout-allow-occlusion style="z-index:3"></video>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var ID = "glebia-tla";
            var $ = function (s) { return document.getElementById(ID + "-" + s); };
            var tlo = $("tlo"), nak = $("nakladka");
            var D = parseFloat(tlo.getAttribute("data-duration")) || 3;
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var R = Number(v.rozmycie) || 14;
            var tryb = v.przesuw || "na-postac";
            var TP = Math.min(Math.max(0.2, Number(v.czas_przesuwu) || 0.8), D * 0.6);
            var ciemno = Math.min(0.4, Math.max(0, v.przyciemnienie == null || v.przyciemnienie === "" ? 0.12 : Number(v.przyciemnienie)));
            var winieta = v.winieta !== false;
            nak.style.background = (winieta ? "radial-gradient(ellipse 75% 60% at 50% 45%, transparent 55%, rgba(8,32,50,0.35) 100%), " : "") + "rgba(8,32,50," + ciemno + ")";
            var RUCH = (function () { var cs = getComputedStyle(document.documentElement), g = function (n, d) { var v = (cs.getPropertyValue(n) || "").trim().replace(/^["']|["']$/g, ""); return v || d; }; return { we: g("--ruch-wejscie", "power2.out"), wy: g("--ruch-wyjscie", "power2.in"), ak: g("--ruch-akcent", "back.out(2)"), pl: g("--ruch-plynny", "power2.inOut") }; })(); // styl ruchu marki (zloz: --ruch-*)
            var tl = gsap.timeline({ paused: true });
            var ostre = { filter: "blur(0px)", scale: 1.0 }, rozmyte = { filter: "blur(" + R + "px)", scale: 1.06 };
            if (tryb === "brak") {
              tl.set(tlo, rozmyte, 0);
              tl.set(nak, { opacity: 1 }, 0);
            } else if (tryb === "na-postac") {
              tl.fromTo(tlo, ostre, Object.assign({ duration: TP, ease: RUCH.pl }, rozmyte), 0.15);
              tl.fromTo(nak, { opacity: 0 }, { opacity: 1, duration: TP, ease: RUCH.pl }, 0.15);
            } else {
              tl.fromTo(tlo, rozmyte, Object.assign({ duration: TP, ease: RUCH.pl }, ostre), Math.max(0.15, D - TP - 0.2));
              tl.fromTo(nak, { opacity: 1 }, { opacity: 0, duration: TP, ease: RUCH.pl }, Math.max(0.15, D - TP - 0.2));
            }
            tl.set({}, {}, D);
            window.__timelines = window.__timelines || {};
            window.__timelines[ID] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>

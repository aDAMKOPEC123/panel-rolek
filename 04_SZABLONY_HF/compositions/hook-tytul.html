<!doctype html>
<!--
  hook-tytul: duży tekst w pierwszych 0-2 s rolki.
  Zmienne (rolka.json -> sceny[].dane):
    tekst     tekst hooka; *gwiazdki* wokół słowa = kolor akcentu, | = złamanie linii
    podtekst  mały tekst pod spodem (może być pusty)
    wariant   slowa | maska | skala | uderzenie   (animacje wejścia; złota kreska pod nagłówkiem zawsze)
              uderzenie = karta wpada z dużej skali z drgnięciem, słowo z *akcentem* wyskakuje i dostaje odręczne kółko
    tlo       pigulka | plansza | brak (pigułka = czytelny tekst na nagraniu)
    pozycja   gora | srodek
  Jeden .clip na całą scenę, ruch tylko w GSAP. Długość sceny ustawia skrypt zloz.
-->
<html
  lang="pl"
  data-composition-id="hook-tytul"
  data-composition-duration="2.5"
  data-composition-variables='[
    {"id":"tekst","type":"string","label":"Tekst hooka","default":"3 rzeczy, których *nie mówię* klientkom"},
    {"id":"podtekst","type":"string","label":"Podtekst","default":""},
    {"id":"wariant","type":"enum","label":"Animacja","default":"slowa","options":[{"value":"slowa","label":"Słowo po słowie"},{"value":"maska","label":"Wjazd z maski"},{"value":"skala","label":"Skala i podkreślenie"},{"value":"uderzenie","label":"Uderzenie i kółko"}]},
    {"id":"tlo","type":"enum","label":"Tło","default":"pigulka","options":[{"value":"pigulka","label":"Pigułka"},{"value":"plansza","label":"Pełna plansza"},{"value":"brak","label":"Brak"}]},
    {"id":"pozycja","type":"enum","label":"Pozycja","default":"gora","options":[{"value":"gora","label":"Góra"},{"value":"srodek","label":"Środek"}]},
    {"id":"oprawa","type":"enum","label":"Oprawa montażu","default":"domyslna","options":[{"value":"domyslna","label":"Domyślna"},{"value":"editorial","label":"Editorial beauty"},{"value":"ekspertka","label":"Ekspertka w gabinecie"},{"value":"makro-asmr","label":"Makro ASMR"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Hook tytuł</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="hook-tytul" data-duration="2.5" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            font-family: var(--font-tekst, "Montserrat"), sans-serif;
          }
          .hk-clip {
            position: absolute;
            inset: 0;
          }
          .hk-plansza {
            position: absolute;
            inset: 0;
            background: var(--tlo-jasne, #f7f1ec);
            opacity: 0;
          }
          .hk-box {
            position: absolute;
            left: var(--safe-left, 60px);
            right: var(--safe-right, 140px);
            top: calc(var(--safe-top, 220px) + 90px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
          }
          .hk-box.srodek {
            top: 720px;
          }
          .hk-card {
            position: relative;
            padding: 34px 44px 38px;
            border-radius: 36px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 18px 50px rgba(8, 32, 50, 0.1);
            max-width: 100%;
          }
          .hk-card.bez-tla {
            background: transparent;
            box-shadow: none;
          }
          .hk-card.bez-tla .hk-title {
            color: var(--bialy, #fff);
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
          }
          .hk-title {
            font-family: var(--font-naglowki, "Playfair Display"), serif;
            font-weight: 600;
            color: var(--tekst, #2b2321);
            line-height: 1.08;
            letter-spacing: -0.01em;
            overflow: visible;
          }
          .hk-line {
            display: block;
            overflow: hidden;
            padding: 0.04em 0 0.1em;
          }
          .hk-line-in {
            display: inline-block;
          }
          .hk-word {
            display: inline-block;
            white-space: nowrap;
          }
          .hk-akcent {
            color: var(--akcent, #b07a6e);
            font-style: italic;
          }
          .hk-title.otwarte .hk-line {
            overflow: visible;
          }
          .hk-word.z-kolkiem {
            position: relative;
          }
          /* odręczne kółko wokół słowa z akcentem (wariant uderzenie) */
          .hk-kolko {
            position: absolute;
            left: -22%;
            top: -16%;
            width: 144%;
            height: 132%;
            overflow: visible;
            pointer-events: none;
          }
          .hk-kolko path {
            fill: none;
            stroke: var(--akcent, #b07a6e);
            stroke-width: 5;
            stroke-linecap: round;
          }
          /* krótka złota kreska pod nagłówkiem (separator) */
          .hk-rule {
            height: 3px;
            width: 130px;
            margin: 26px auto 0;
            border-radius: 2px;
            background: var(--akcent, #b07a6e);
            transform-origin: center center;
          }
          .hk-sub {
            margin-top: 20px;
            font-size: 28px;
            font-weight: 600;
            color: var(--tekst-2, #8c6b5d);
            letter-spacing: 0.24em;
            text-transform: uppercase;
          }
          .hk-sub:empty {
            display: none;
          }
          .hk-editorial .hk-box, .hk-ekspertka .hk-box { align-items: flex-start; text-align: left; }
          .hk-editorial .hk-card { padding: 30px 38px; border-radius: 8px; background: #fff8f1; }
          .hk-editorial .hk-rule { margin: 14px 0 0; width: 84px; }
          .hk-editorial .hk-akcent { color: #7b463b; }
          .hk-ekspertka .hk-card { padding: 26px 32px; border-radius: 8px; border-left: 7px solid #345f66; background: #f7fbfb; }
          .hk-ekspertka .hk-title { font-family: var(--font-tekst, "Montserrat"), sans-serif; font-weight: 700; color: #183239; }
          .hk-ekspertka .hk-akcent { color: #234f57; font-style: normal; }
          .hk-ekspertka .hk-rule { display: none; }
          .hk-makro-asmr .hk-card { padding: 14px 26px; border-radius: 8px; background: rgba(24, 20, 18, 0.92); }
          .hk-makro-asmr .hk-title, .hk-makro-asmr .hk-akcent, .hk-makro-asmr .hk-sub { color: #fff4ec; }
          .hk-makro-asmr .hk-title { font-family: var(--font-tekst, "Montserrat"), sans-serif; }
          .hk-makro-asmr .hk-akcent { font-style: normal; }
          .hk-makro-asmr .hk-rule { display: none; }
        </style>
        <div id="hook-tytul-clip" class="clip hk-clip" data-start="0" data-duration="2.5" data-track-index="0">
          <div id="hook-tytul-plansza" class="hk-plansza"></div>
          <div id="hook-tytul-box" class="hk-box">
            <div id="hook-tytul-card" class="hk-card">
              <div id="hook-tytul-title" class="hk-title"></div>
              <div id="hook-tytul-rule" class="hk-rule"></div>
              <div id="hook-tytul-sub" class="hk-sub"></div>
            </div>
          </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var ID = "hook-tytul";
            var $ = function (s) { return document.getElementById(ID + "-" + s); };
            var clip = $("clip");
            var D = parseFloat(clip.getAttribute("data-duration")) || 2.5;
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var tekst = String(v.tekst == null ? "3 rzeczy, których *nie mówię* klientkom" : v.tekst);
            var wariant = ["slowa", "maska", "skala", "uderzenie"].indexOf(v.wariant) >= 0 ? v.wariant : "slowa";
            var tlo = ["pigulka", "plansza", "brak"].indexOf(v.tlo) >= 0 ? v.tlo : "pigulka";
            var title = $("title");
            var oprawa = v.oprawa;
            if (["editorial", "ekspertka", "makro-asmr"].indexOf(oprawa) >= 0) clip.classList.add("hk-" + oprawa);

            // Rozmiar fontu od długości: im krótszy hook, tym większy.
            var plain = tekst.replace(/[*|]/g, "");
            var size = plain.length <= 16 ? 112 : plain.length <= 28 ? 96 : plain.length <= 44 ? 80 : 66;
            if (oprawa === "ekspertka") size = Math.round(size * 0.78);
            if (oprawa === "makro-asmr") size = Math.min(58, Math.round(size * 0.63));
            if (wariant === "uderzenie") size = Math.round(size * 1.1);
            title.style.fontSize = size + "px";

            // Budowa linii i słów. *słowo* = akcent, | = nowa linia.
            var words = [];
            var akcent = false;
            tekst.split("|").forEach(function (lineText) {
              var line = document.createElement("span");
              line.className = "hk-line";
              var inner = document.createElement("span");
              inner.className = "hk-line-in";
              lineText.trim().split(/\s+/).forEach(function (w, i) {
                if (!w) return;
                // Każda * przełącza akcent, więc działa też "*brwi*:" i "*dwa słowa*".
                var span = document.createElement("span");
                span.className = "hk-word";
                w.split("*").forEach(function (part, j) {
                  if (j > 0) akcent = !akcent;
                  if (!part) return;
                  var seg = document.createElement("span");
                  if (akcent) { seg.className = "hk-akcent"; span.akcent = true; }
                  seg.textContent = part;
                  span.appendChild(seg);
                });
                if (i > 0) inner.appendChild(document.createTextNode(" "));
                inner.appendChild(span);
                words.push(span);
              });
              line.appendChild(inner);
              title.appendChild(line);
            });
            $("sub").textContent = v.podtekst ? String(v.podtekst) : "";
            if (v.pozycja === "srodek") $("box").classList.add("srodek");
            if (tlo === "brak") $("card").classList.add("bez-tla");

            var RUCH = (function () { var cs = getComputedStyle(document.documentElement), g = function (n, d) { var v = (cs.getPropertyValue(n) || "").trim().replace(/^["']|["']$/g, ""); return v || d; }; return { we: g("--ruch-wejscie", "power2.out"), wy: g("--ruch-wyjscie", "power2.in"), ak: g("--ruch-akcent", "back.out(2)"), pl: g("--ruch-plynny", "power2.inOut") }; })(); // styl ruchu marki (zloz: --ruch-*)
            var tl = gsap.timeline({ paused: true });
            var lines = title.querySelectorAll(".hk-line-in");
            var card = $("card");
            if (tlo === "plansza") {
              tl.fromTo($("plansza"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: RUCH.we }, 0);
              card.style.background = "transparent";
              card.style.boxShadow = "none";
            } else {
              tl.set($("plansza"), { opacity: 0 }, 0);
            }
            // Karta wjeżdża zawsze tak samo krótko; różni się tekst.
            tl.fromTo(card, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.25, ease: RUCH.we }, 0);

            if (wariant === "slowa") {
              tl.fromTo(words, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: RUCH.we }, 0.08);
            } else if (wariant === "maska") {
              tl.fromTo(lines, { yPercent: 110 }, { yPercent: 0, duration: 0.45, stagger: 0.09, ease: RUCH.we }, 0.05);
            } else if (wariant === "uderzenie") {
              // Karta wpada z dużej skali, drga jak po uderzeniu, potem słowo z akcentem wyskakuje i dostaje kółko.
              title.classList.add("otwarte");
              tl.fromTo(card, { scale: 1.45, rotation: -3 }, { scale: 1, rotation: 0, duration: 0.32, ease: RUCH.ak, immediateRender: false }, 0);
              tl.fromTo($("box"), { x: 0 }, { keyframes: [{ x: -14 }, { x: 11 }, { x: -7 }, { x: 4 }, { x: 0 }], duration: 0.28, ease: "none", immediateRender: false }, 0.3);
              var mocne = words.filter(function (w) { return w.akcent; });
              mocne.forEach(function (w, k) {
                w.classList.add("z-kolkiem");
                var ns = "http://www.w3.org/2000/svg";
                var svg = document.createElementNS(ns, "svg");
                svg.setAttribute("class", "hk-kolko");
                svg.setAttribute("viewBox", "0 0 200 100");
                svg.setAttribute("preserveAspectRatio", "none");
                var p = document.createElementNS(ns, "path");
                p.setAttribute("d", "M 132 9 C 70 2, 12 22, 10 52 C 8 84, 70 97, 120 93 C 172 89, 197 66, 190 40 C 183 16, 140 4, 92 8");
                p.setAttribute("pathLength", "1");
                p.setAttribute("vector-effect", "non-scaling-stroke");
                svg.appendChild(p);
                w.appendChild(svg);
                var t0 = 0.5 + k * 0.15;
                tl.fromTo(w, { scale: 1 }, { scale: 1.14, duration: 0.14, yoyo: true, repeat: 1, ease: RUCH.we, immediateRender: false }, t0);
                tl.fromTo(p, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: RUCH.pl }, t0 + 0.1);
              });
              // Delikatny oddech karty do końca, żeby hook cały czas żył.
              tl.fromTo(card, { scale: 1 }, { scale: 1.035, duration: Math.max(0.4, D - 1.1), ease: RUCH.pl, immediateRender: false }, 0.8);
            } else {
              tl.fromTo(title, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.4, ease: RUCH.we }, 0.05);
            }
            tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: RUCH.pl }, 0.35);
            tl.fromTo($("sub"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: RUCH.we }, 0.45);
            // Wyjście w ostatnich 0.25 s, żeby kolejna scena weszła na czysto.
            var outAt = Math.max(0.7, D - 0.28);
            tl.to([card, $("plansza")], { opacity: 0, duration: 0.25, ease: RUCH.wy }, outAt);
            window.__timelines = window.__timelines || {};
            window.__timelines[ID] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>

<!doctype html>
<!--
  lista-krokow: numerowane plansze, np. "3 błędy przy pielęgnacji stóp".
  Zmienne:
    tytul   nagłówek (pokazywany na początku i potem mały u góry)
    kroki   kolejne punkty rozdzielone | (2-5 punktów)
    tlo     plansza (kremowe tło) | nagranie (karta na przezroczystym tle, pod spodem nagranie)
  Czas: tytuł ok. 1.2 s, reszta dzielona równo między kroki.
-->
<html
  lang="pl"
  data-composition-id="lista-krokow"
  data-composition-duration="7"
  data-composition-variables='[
    {"id":"tytul","type":"string","label":"Tytuł","default":"3 błędy przy *pielęgnacji stóp*"},
    {"id":"kroki","type":"string","label":"Kroki (oddziel |)","default":"Wycinasz skórki na okrągło|Pilnik metalowy na mokro|Krem między palce"},
    {"id":"tlo","type":"enum","label":"Tło","default":"plansza","options":[{"value":"plansza","label":"Plansza"},{"value":"nagranie","label":"Na nagraniu"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Lista kroków</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="lista-krokow" data-duration="7" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            font-family: var(--font-tekst, "Montserrat"), sans-serif;
            color: var(--tekst, #2b2321);
          }
          .lk-clip { position: absolute; inset: 0; }
          .lk-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 80% at 50% 30%, var(--tlo-jasne, #f7f1ec) 0%, var(--nude, #e9d9cf) 100%);
          }
          .lk-bg.ukryte { display: none; }
          .lk-title {
            position: absolute;
            left: var(--safe-left, 60px);
            right: var(--safe-right, 140px);
            top: 640px;
            text-align: center;
            font-family: var(--font-naglowki, "Playfair Display"), serif;
            font-weight: 700;
            font-size: 92px;
            line-height: 1.08;
            transform-origin: center top;
          }
          .lk-title em { color: var(--akcent, #b07a6e); }
          .lk-card {
            position: absolute;
            left: var(--safe-left, 60px);
            right: var(--safe-right, 140px);
            top: 560px;
            padding: 56px 48px 60px;
            border-radius: 40px;
            background: color-mix(in srgb, var(--bialy, #fff) 88%, transparent);
            box-shadow: 0 20px 60px rgba(43, 35, 33, 0.14);
            text-align: center;
            opacity: 0;
          }
          .lk-num {
            font-family: var(--font-naglowki, "Playfair Display"), serif;
            font-size: 190px;
            font-weight: 900;
            line-height: 0.9;
            color: var(--akcent, #b07a6e);
          }
          .lk-txt {
            margin-top: 26px;
            font-size: 62px;
            font-weight: 700;
            line-height: 1.15;
          }
          .lk-dots {
            position: absolute;
            left: 0;
            right: 0;
            top: 1260px;
            display: flex;
            justify-content: center;
            gap: 18px;
          }
          .lk-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: color-mix(in srgb, var(--akcent, #b07a6e) 30%, transparent);
          }
        </style>
        <div id="lista-krokow-clip" class="clip lk-clip" data-start="0" data-duration="7" data-track-index="0">
          <div id="lista-krokow-bg" class="lk-bg"></div>
          <div id="lista-krokow-title" class="lk-title"></div>
          <div id="lista-krokow-cards"></div>
          <div id="lista-krokow-dots" class="lk-dots"></div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var ID = "lista-krokow";
            var $ = function (s) { return document.getElementById(ID + "-" + s); };
            var clip = $("clip");
            var D = parseFloat(clip.getAttribute("data-duration")) || 7;
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var tytul = String(v.tytul == null ? "3 błędy przy *pielęgnacji stóp*" : v.tytul);
            var kroki = String(v.kroki == null ? "Wycinasz skórki na okrągło|Pilnik metalowy na mokro|Krem między palce" : v.kroki)
              .split("|").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 5);
            if (v.tlo === "nagranie") $("bg").classList.add("ukryte");
            var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
            $("title").innerHTML = esc(tytul).replace(/\*([^*]+)\*/g, "<em>$1</em>");
            var cards = [], dots = [];
            kroki.forEach(function (k, i) {
              var c = document.createElement("div");
              c.className = "lk-card";
              c.innerHTML = '<div class="lk-num">' + (i + 1) + '</div><div class="lk-txt"></div>';
              c.querySelector(".lk-txt").textContent = k;
              $("cards").appendChild(c);
              cards.push(c);
              var d = document.createElement("div");
              d.className = "lk-dot";
              $("dots").appendChild(d);
              dots.push(d);
            });

            var RUCH = (function () { var cs = getComputedStyle(document.documentElement), g = function (n, d) { var v = (cs.getPropertyValue(n) || "").trim().replace(/^["']|["']$/g, ""); return v || d; }; return { we: g("--ruch-wejscie", "power2.out"), wy: g("--ruch-wyjscie", "power2.in"), ak: g("--ruch-akcent", "back.out(2)"), pl: g("--ruch-plynny", "power2.inOut") }; })(); // styl ruchu marki (zloz: --ruch-*)
            var tl = gsap.timeline({ paused: true });
            var T0 = Math.min(1.3, D * 0.2);
            var per = (D - T0) / Math.max(1, cards.length);
            tl.fromTo($("title"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: RUCH.we }, 0.05);
            // Tytuł wędruje do góry i maleje, robi miejsce na kroki.
            tl.to($("title"), { y: -330, scale: 0.6, duration: 0.45, ease: RUCH.pl }, T0 - 0.3);
            tl.fromTo($("dots"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, T0);
            cards.forEach(function (c, i) {
              var a = T0 + i * per;
              tl.fromTo(c, { opacity: 0, y: 60, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: RUCH.we }, a + 0.05);
              tl.to(dots[i], { backgroundColor: "var(--akcent, #b07a6e)", scale: 1.3, duration: 0.2 }, a + 0.05);
              if (i < cards.length - 1) {
                tl.to(c, { opacity: 0, y: -40, duration: 0.22, ease: RUCH.wy }, a + per - 0.2);
                tl.to(dots[i], { scale: 1, duration: 0.2 }, a + per - 0.2);
              }
            });
            tl.set({}, {}, D);
            window.__timelines = window.__timelines || {};
            window.__timelines[ID] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>

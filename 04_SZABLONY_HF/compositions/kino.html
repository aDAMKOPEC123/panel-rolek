<!doctype html>
<!--
  kino: kinowe otwarcie i ziarno taśmy na całą rolkę (bez tekstu).
    pasy   czarne pasy 2.39:1 na starcie, rozsuwają się w pełny kadr (czas: pasy_czas, 0 = bez pasów)
    ziarno delikatne ziarno filmowe (SVG feTurbulence), drga skokowo 12 razy na sekundę, krycie: ziarno (0 = bez)
  Ruch tylko w GSAP, pozycje ziarna z deterministycznej sekwencji (bez Math.random), więc render = podgląd.
  Daj scenę od 0 na całą długość rolki.
-->
<html
  lang="pl"
  data-composition-id="kino"
  data-composition-duration="6"
  data-composition-variables='[
    {"id":"pasy_czas","type":"number","label":"Rozsuwanie pasów (s, 0 = bez)","default":1.1,"min":0,"max":3,"step":0.1},
    {"id":"ziarno","type":"number","label":"Krycie ziarna (0 = bez)","default":0.08,"min":0,"max":0.3,"step":0.01}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Kino: pasy i ziarno</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="kino" data-duration="6" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; pointer-events: none; }
          .ki-clip { position: absolute; inset: 0; overflow: hidden; }
          .ki-ziarno { position: absolute; left: -240px; top: -240px; width: 1560px; height: 2400px; mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
            background-size: 260px 260px; }
          .ki-pas { position: absolute; left: 0; right: 0; height: 734px; background: #050608; }
          .ki-pas.gora { top: 0; transform-origin: 50% 0; }
          .ki-pas.dol { bottom: 0; transform-origin: 50% 100%; }
        </style>
        <div id="kino-clip" class="clip ki-clip" data-start="0" data-duration="6" data-track-index="0">
          <div id="kino-ziarno" class="ki-ziarno" data-layout-allow-overflow></div>
          <div id="kino-gora" class="ki-pas gora"></div>
          <div id="kino-dol" class="ki-pas dol"></div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var ID = "kino";
            var $ = function (s) { return document.getElementById(ID + "-" + s); };
            var D = parseFloat($("clip").getAttribute("data-duration")) || 6;
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var pasy = v.pasy_czas == null ? 1.1 : Number(v.pasy_czas);
            var krycie = v.ziarno == null ? 0.08 : Number(v.ziarno);
            var RUCH = (function () { var cs = getComputedStyle(document.documentElement), g = function (n, d) { var v = (cs.getPropertyValue(n) || "").trim().replace(/^["']|["']$/g, ""); return v || d; }; return { we: g("--ruch-wejscie", "power2.out"), wy: g("--ruch-wyjscie", "power2.in"), ak: g("--ruch-akcent", "back.out(2)"), pl: g("--ruch-plynny", "power2.inOut") }; })(); // styl ruchu marki (zloz: --ruch-*)
            var tl = gsap.timeline({ paused: true });
            tl.to({}, { duration: D, ease: "none" }, 0);
            // Pasy: krótko stoją (kadr jak w kinie), potem rozsuwają się w pełny pion.
            if (pasy > 0) {
              var stoi = Math.min(0.35, pasy * 0.3);
              tl.fromTo([$("gora"), $("dol")], { scaleY: 1 }, { scaleY: 0, duration: pasy - stoi, ease: RUCH.pl }, stoi);
              tl.set([$("gora"), $("dol")], { visibility: "hidden" }, pasy + 0.01);
            } else {
              tl.set([$("gora"), $("dol")], { visibility: "hidden" }, 0);
            }
            // Ziarno: skoki pozycji 12x/s z sekwencji złotego podziału (deterministycznie).
            if (krycie > 0) {
              tl.set($("ziarno"), { opacity: krycie }, 0);
              var n = Math.ceil(D * 12);
              for (var i = 0; i < n; i++) {
                var fx = (i * 0.6180339887) % 1, fy = (i * 0.7548776662 + 0.31) % 1;
                tl.set($("ziarno"), { x: Math.round(fx * 220), y: Math.round(fy * 220) }, i / 12);
              }
            } else {
              tl.set($("ziarno"), { visibility: "hidden" }, 0);
            }
            window.__timelines = window.__timelines || {};
            window.__timelines[ID] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>

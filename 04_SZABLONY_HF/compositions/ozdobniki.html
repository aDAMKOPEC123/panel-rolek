<!doctype html>
<!--
  ozdobniki: cienkie złote linie i łuki w rogach kadru (+ opcjonalnie akwarelowe, błękitno-szare plamy).
  Nakładka bez tekstu, na nagraniu albo planszy. Linie rysują się spokojnie na starcie i gasną na końcu.
  Zmienne:
    rogi      ukos (prawy górny + lewy dolny) | wszystkie | gora (oba górne)
    akwarela  plamy akwarelowe w tle (true/false); na nagraniu delikatnie, na planszy pełniej
    krycie    0.3-1
  Kolory tylko z var(--akcent), var(--zloto-jasne), var(--akwarela).
-->
<html
  lang="pl"
  data-composition-id="ozdobniki"
  data-composition-duration="4"
  data-composition-variables='[
    {"id":"rogi","type":"enum","label":"Rogi","default":"ukos","options":[{"value":"ukos","label":"Prawy górny + lewy dolny"},{"value":"wszystkie","label":"Wszystkie cztery"},{"value":"gora","label":"Oba górne"}]},
    {"id":"akwarela","type":"boolean","label":"Akwarelowe plamy","default":false},
    {"id":"krycie","type":"number","label":"Krycie","default":0.9,"min":0.3,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Ozdobniki</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="ozdobniki" data-duration="4" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
          .oz-clip { position: absolute; inset: 0; }
          .oz-plama { position: absolute; border-radius: 48% 52% 58% 42% / 50% 46% 54% 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--akwarela, #a9bccb) 45%, transparent), transparent); filter: blur(34px); display: none; }
          .oz-plama.p1 { left: -220px; top: 140px; width: 640px; height: 560px; }
          .oz-plama.p2 { right: -240px; bottom: 260px; width: 700px; height: 600px; }
          .z-akwarela .oz-plama { display: block; }
          .oz-rog { position: absolute; width: 330px; height: 330px; overflow: visible; display: none; }
          .oz-rog path { fill: none; stroke-linecap: round; }
          .oz-rog .l1 { stroke: var(--akcent, #c8a15f); stroke-width: 3; }
          .oz-rog .l2 { stroke: var(--zloto-jasne, #d7bd89); stroke-width: 2; }
          .oz-rog circle { fill: var(--akcent, #c8a15f); }
          .oz-rog.pg { right: 0; top: 0; }
          .oz-rog.ld { left: 0; bottom: 0; transform: rotate(180deg); }
          .oz-rog.lg { left: 0; top: 0; transform: scaleX(-1); }
          .oz-rog.pd { right: 0; bottom: 0; transform: scaleY(-1); }
          .r-ukos .pg, .r-ukos .ld, .r-wszystkie .oz-rog, .r-gora .pg, .r-gora .lg { display: block; }
        </style>
        <div id="ozdobniki-clip" class="clip oz-clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="ozdobniki-p1" class="oz-plama p1"></div>
          <div id="ozdobniki-p2" class="oz-plama p2"></div>
          <svg class="oz-rog pg" viewBox="0 0 330 330"><path class="l1" d="M 50 0 A 280 280 0 0 0 330 280" /><path class="l2" d="M 120 0 A 210 210 0 0 0 330 210" /><circle cx="128" cy="76" r="5" /></svg>
          <svg class="oz-rog ld" viewBox="0 0 330 330"><path class="l1" d="M 50 0 A 280 280 0 0 0 330 280" /><path class="l2" d="M 120 0 A 210 210 0 0 0 330 210" /><circle cx="128" cy="76" r="5" /></svg>
          <svg class="oz-rog lg" viewBox="0 0 330 330"><path class="l1" d="M 50 0 A 280 280 0 0 0 330 280" /><path class="l2" d="M 120 0 A 210 210 0 0 0 330 210" /><circle cx="128" cy="76" r="5" /></svg>
          <svg class="oz-rog pd" viewBox="0 0 330 330"><path class="l1" d="M 50 0 A 280 280 0 0 0 330 280" /><path class="l2" d="M 120 0 A 210 210 0 0 0 330 210" /><circle cx="128" cy="76" r="5" /></svg>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var ID = "ozdobniki";
            var clip = document.getElementById(ID + "-clip");
            var D = parseFloat(clip.getAttribute("data-duration")) || 4;
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var rogi = ["ukos", "wszystkie", "gora"].indexOf(v.rogi) >= 0 ? v.rogi : "ukos";
            clip.classList.add("r-" + rogi);
            var akw = v.akwarela === true || v.akwarela === "true";
            if (akw) clip.classList.add("z-akwarela");
            var k = Number(v.krycie);
            var op = isFinite(k) && k > 0 ? Math.min(1, Math.max(0.3, k)) : 0.9;
            var RUCH = (function () { var cs = getComputedStyle(document.documentElement), g = function (n, d) { var v = (cs.getPropertyValue(n) || "").trim().replace(/^["']|["']$/g, ""); return v || d; }; return { we: g("--ruch-wejscie", "power2.out"), wy: g("--ruch-wyjscie", "power2.in"), ak: g("--ruch-akcent", "back.out(2)"), pl: g("--ruch-plynny", "power2.inOut") }; })(); // styl ruchu marki (zloz: --ruch-*)
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(clip, { opacity: 0 }, { opacity: op, duration: 0.3, ease: RUCH.we }, 0);
            var linie = Array.prototype.slice.call(clip.querySelectorAll(".oz-rog path"));
            linie.forEach(function (p, i) {
              tl.fromTo(p, { strokeDasharray: 520, strokeDashoffset: 520 }, { strokeDashoffset: 0, duration: 1.0, ease: RUCH.pl }, 0.05 + (i % 2) * 0.14);
            });
            tl.fromTo(clip.querySelectorAll(".oz-rog circle"), { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: RUCH.we }, 0.8);
            if (akw) {
              var pl = [document.getElementById(ID + "-p1"), document.getElementById(ID + "-p2")];
              tl.fromTo(pl, { scale: 0.9 }, { scale: 1.04, duration: D, ease: "none" }, 0);
              tl.fromTo(pl[0], { x: 0 }, { x: 30, duration: D, ease: "none", immediateRender: false }, 0);
              tl.fromTo(pl[1], { x: 0 }, { x: -30, duration: D, ease: "none", immediateRender: false }, 0);
            }
            tl.to(clip, { opacity: 0, duration: 0.35, ease: RUCH.wy }, Math.max(0.6, D - 0.35));
            window.__timelines = window.__timelines || {};
            window.__timelines[ID] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>

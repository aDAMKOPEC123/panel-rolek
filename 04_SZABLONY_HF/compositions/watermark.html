<!doctype html>
<!--
  watermark: dyskretny znak w lewym górnym rogu (w safe zone, prawy bok zajmują przyciski IG).
  Zmienne:
    tryb    tekst (handle w pigułce) | obraz (02_BRAND/watermark/watermark.png, wstawia skrypt zloz)
    handle  tekst znaku
    krycie  0.3-1
-->
<html
  lang="pl"
  data-composition-id="watermark"
  data-composition-duration="10"
  data-composition-variables='[
    {"id":"tryb","type":"enum","label":"Tryb","default":"tekst","options":[{"value":"tekst","label":"Handle"},{"value":"obraz","label":"Obraz"}]},
    {"id":"handle","type":"string","label":"Handle","default":"@twoj_gabinet"},
    {"id":"krycie","type":"number","label":"Krycie","default":0.85,"min":0.3,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Watermark</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="watermark" data-duration="10" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; pointer-events: none; }
          .wm-clip { position: absolute; inset: 0; }
          .wm {
            position: absolute;
            left: calc(var(--safe-left, 60px) + 4px);
            top: calc(var(--safe-top, 220px) + 12px);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px 11px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--akcent, #b07a6e) 55%, transparent);
            color: var(--tekst, #2b2321);
            font-family: var(--font-tekst, "Montserrat"), sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
          }
          .wm-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--akcent, #b07a6e); }
          .wm-img { position: absolute; left: calc(var(--safe-left, 60px) + 4px); top: calc(var(--safe-top, 220px) + 12px); width: 110px; height: 110px; object-fit: contain; display: none; }
          .obraz .wm { display: none; }
          .obraz .wm-img { display: block; }
        </style>
        <div id="watermark-clip" class="clip wm-clip" data-start="0" data-duration="10" data-track-index="0">
          <div id="watermark-pill" class="wm"><span class="wm-dot"></span><span id="watermark-txt"></span></div>
          <img id="watermark-img" class="wm-img" data-slot-media="znak" src="assets/demo/watermark.png" alt="" />
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            var ID = "watermark";
            var clip = document.getElementById(ID + "-clip");
            var D = parseFloat(clip.getAttribute("data-duration")) || 10;
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            if (v.tryb === "obraz") clip.classList.add("obraz");
            document.getElementById(ID + "-txt").textContent = v.handle == null ? "@twoj_gabinet" : String(v.handle);
            var k = Number(v.krycie);
            var op = isFinite(k) && k > 0 ? Math.min(1, Math.max(0.3, k)) : 0.85;
            var tl = gsap.timeline({ paused: true });
            tl.fromTo([document.getElementById(ID + "-pill"), document.getElementById(ID + "-img")], { opacity: 0 }, { opacity: op, duration: 0.4 }, 0.3);
            tl.set({}, {}, D);
            window.__timelines = window.__timelines || {};
            window.__timelines[ID] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
